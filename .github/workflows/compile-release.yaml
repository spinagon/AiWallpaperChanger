name: Compile release APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: Compile release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local properties
        run: touch local.properties

      - name: Compile release APK
        run: ./gradlew assembleNsfwDisabledNoKeyDozeDisabledBillingDisabledRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/nsfwDisabledNoKeyDozeDisabledBillingDisabled/release/*.apk
          if-no-files-found: error